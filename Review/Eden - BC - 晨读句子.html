<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>听写练习（华文优先）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans SC", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; background-color: #f0f0f0;
    }
    .container {
      text-align: center; padding: 20px; background: #fff; border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,.1); max-width: 720px; width: 92%;
    }
    .question { font-size: 28px; margin-bottom: 10px; }
    .word { font-size: 34px; margin-bottom: 16px; }
    .btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
  justify-content: center;
  align-items: center;
  margin-top: 15px;
  margin-bottom: 14px;
}

.btn-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.search-box {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 15px;
}

.search-box input {
  font-size: 18px;
  padding: 8px 12px;
  width: 180px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.btn.search-btn {
  background-color: #008cff;
}

.pinyin {
  font-size: 18px;
  color: #555;
  margin-top: -5px;
  margin-bottom: 25px;
  font-style: italic;
}

    .btn {
      font-size: 18px; padding: 10px 20px; border: none; border-radius: 8px;
      background-color: #dc3545; color: #fff; cursor: pointer;
    }
    .btn.secondary { background-color: #6c757d; }
    .btn.info { background-color: #dc3545; }
    .btn.success { background-color: #dc3545; }
    .btn.warning { background-color: #ffc107; color: #000; }
    .meaning {
      margin-top: 10px; font-size: 20px; background: #f8f9fa; border-radius: 8px;
      padding: 12px; min-height: 60px; line-height: 1.6; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="search-box">
  <input 
    type="text" 
    id="searchInput" 
    placeholder=""
  >

  <button 
    class="btn search-btn" 
    onclick="searchWord()">
    Search
  </button>
</div>
    <div class="question" id="question">题目 1</div>
    <div class="word" id="word">—</div>
    
    <div class="btns">
      <!-- 华文优先 -->
       <div class="btn-row">
      <button class="btn" onclick="playChineseWord()">朗读</button>
      <button class="btn success" onclick="showEnglish()">English</button>
      <button class="btn info" onclick="showMalay()">BM</button>
      </div>

      <div class="btn-row">
      <button class="btn warning" onclick="showChineseSentence()">造句</button>
      <button class="btn warning" onclick="showEnglishSentence()">Sentence</button>
      <button class="btn warning" onclick="showMalaySentence()">Bina Ayat</button>
      </div>

      <div class="btn-row">
      <button class="btn secondary" onclick="prevWord()">上一题</button>
      <button class="btn secondary" onclick="nextWord()">下一题</button>
      </div>

    <div class="meaning" id="meaning"></div>
  </div>

  <script>
    // ====== 词库 ======
    const zh = [
      "食物",
  "影子",
  "灯光",
  "怎么",
  "出门",
  "笑脸",
  "停电",
  "不肯",
  "翅膀",
  "男女老少",
  "国庆",
  "稻米",
  "背着",
  "收割",
  "问题"
    ];

    const py = [
  "shí wù",
  "yǐng zi",
  "dēng guāng",
  "zěn me",
  "chū mén",
  "xiào liǎn",
  "tíng diàn",
  "bù kěn",
  "chì bǎng",
  "nán nǚ lǎo shào",
  "guó qìng",
  "dào mǐ",
  "bēi zhe",
  "shōu gē",
  "wèn tí"
];

    const en = [
      "food",
  "shadow",
  "light",
  "how",
  "go out",
  "smiling face",
  "power outage",
  "refuse",
  "wing",
  "men, women, old and young",
  "National Day",
  "rice",
  "carry on the back",
  "harvest",
  "question"
    ];

    const ms = [
      "makanan",
  "bayang",
  "cahaya lampu",
  "bagaimana",
  "keluar rumah",
  "wajah ceria",
  "gangguan elektrik",
  "tidak mahu",
  "sayap",
  "lelaki, perempuan, tua dan muda",
  "Hari Kebangsaan",
  "beras",
  "memikul",
  "menuai",
  "soalan"
    ];

    const zhSentences = [
      "大白鹅肚子饿了，就找食物吃。",
  "我在屋里走，影子也跟着我走。",
  "爸爸在灯光下做手影。",
  "妈妈没有带雨伞，她怎么回家呢？",
  "下雨了，妈妈出门买菜了。",
  "两张笑脸就像红色的小气球。",
  "一天晚上，家里停电了。",
  "妹妹不肯上床睡觉。",
  "鸟儿有一双翅膀。",
  "男女老少在唱歌、跳舞。",
  "八月三十一日是我国的国庆。",
  "阳光照着农田，禾稻米金黄。",
  "我背着书包，从天桥上走过。",
  "我们一起收割青菜。",
  "弟弟最爱问妈妈问题。"
    ];

    const enSentences = [
      "The white goose was hungry, so it looked for food to eat.",
  "I walk in the house, and my shadow follows me.",
  "Father makes hand shadows under the light.",
  "Mother did not bring an umbrella, how will she go home?",
  "It is raining, mother went out to buy vegetables.",
  "Two smiling faces are like small red balloons.",
  "One night, there was a power outage at home.",
  "My sister refuses to go to bed.",
  "The bird has a pair of wings.",
  "Men, women, old and young are singing and dancing.",
  "The thirty-first of August is our country's National Day.",
  "The sunlight shines on the farm, the paddy is golden yellow.",
  "I carry my school bag and walk across the pedestrian bridge.",
  "We harvest the vegetables together.",
  "My brother loves to ask mother questions."
    ];

    const msSentences = [
      "Angsa putih itu lapar, jadi ia mencari makanan.",
  "Saya berjalan di dalam rumah, bayang saya juga mengikut saya.",
  "Ayah membuat bayang tangan di bawah cahaya lampu.",
  "Ibu tidak membawa payung, bagaimana dia hendak balik ke rumah?",
  "Hujan turun, ibu keluar rumah untuk membeli sayur.",
  "Dua wajah ceria itu seperti belon kecil berwarna merah.",
  "Pada suatu malam, rumah kami mengalami gangguan elektrik.",
  "Adik tidak mahu naik ke katil untuk tidur.",
  "Burung mempunyai sepasang sayap.",
  "Lelaki, perempuan, tua dan muda sedang menyanyi dan menari.",
  "Tiga puluh satu Ogos ialah Hari Kebangsaan negara kita.",
  "Cahaya matahari menyinari sawah, padi berwarna kuning keemasan.",
  "Saya memikul beg sekolah, berjalan melalui jejantas.",
  "Kami menuai sayur bersama-sama.",
  "Adik paling suka bertanya soalan kepada ibu."
    ];

    // ===== DOM & 语音 =====
    let currentIndex = 0;
    const questionDiv = document.getElementById('question');
    const wordDiv = document.getElementById('word');
    const pinyinDiv = document.getElementById('pinyin');
    const meaningDiv = document.getElementById('meaning');

    function setMeaning(text) { meaningDiv.textContent = text || ''; }

    // 统一的朗读函数（默认：慢速 0.4、音高 0.6）
    function speak(text, lang, preferNames = [], rate = 0.4, pitch = 0.6) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = rate;
      u.pitch = pitch;

      const trySpeak = () => {
        const voices = speechSynthesis.getVoices() || [];
        let candidates = voices.filter(v => (v.lang || '').toLowerCase().startsWith(lang.toLowerCase()));
        // 如果没有马来语，回退印尼语
        if (!candidates.length && lang.toLowerCase().startsWith('ms')) {
          candidates = voices.filter(v => (v.lang || '').toLowerCase().startsWith('id'));
          if (candidates.length) u.lang = 'id-ID';
        }
        for (const key of preferNames) {
          const found = candidates.find(v => (v.name || '').toLowerCase().includes(key.toLowerCase()));
          if (found) { u.voice = found; break; }
        }
        if (!u.voice && candidates.length) u.voice = candidates[0];
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      };

      if (speechSynthesis.getVoices().length === 0) {
        speechSynthesis.onvoiceschanged = trySpeak;
      }
      trySpeak();
    }

    // ===== 华文为主（按钮函数不再覆盖速率/音高）=====
    function playChineseWord() {
  const text = zh[currentIndex] || '';
  const pinyin = py[currentIndex] || '';

  setMeaning(pinyin);

  speak(text, 'zh-CN', ['Xiaoyi','Microsoft','male']);
}

    function showEnglish() {
      const text = en[currentIndex] || '(待添加英文)';
      setMeaning(text);
      speak(text, 'en-US', ['Google','Microsoft','Natural']);
    }

    function showMalay() {
      const text = ms[currentIndex] || '(待添加马来文)';
      setMeaning(text);
      speak(text, 'ms-MY', ['Malay','Bahasa','Microsoft']);
    }

    function showChineseSentence() {
      const text = zhSentences[currentIndex] || '(待添加华文造句)';
      setMeaning(text);
      speak(text, 'zh-CN', ['Xiaoyi','Microsoft']);
    }

    function showEnglishSentence() {
      const text = enSentences[currentIndex] || '(待添加英文句子)';
      setMeaning(text);
      speak(text, 'en-US', ['Google','Microsoft']);
    }

    function showMalaySentence() {
      const text = msSentences[currentIndex] || '(待添加马来文句子)';
      setMeaning(text);
      speak(text, 'ms-MY', ['Malay','Bahasa','Microsoft']);
    }

    function nextWord() {
      if (currentIndex < zh.length - 1) {
        currentIndex++;
        updateQuestion();
      }
    }

    function prevWord() {
      if (currentIndex > 0) {
        currentIndex--;
        updateQuestion();
      }
    }

    function updateQuestion() {
  questionDiv.innerText = `题目 ${currentIndex + 1}`;
  wordDiv.innerText = zh[currentIndex] || '—';
  setMeaning('');
}


// ===== 搜索功能 =====
function searchWord() {

  const keyword = document.getElementById("searchInput").value.trim();

  if (!keyword) {
    alert("请输入要搜索的词语");
    return;
  }


  const index = zh.indexOf(keyword);


  if (index !== -1) {

    currentIndex = index;
    updateQuestion();

  } else {

    alert("没有找到：" + keyword);

  }

}


updateQuestion();
  </script>
</body>
</html>
