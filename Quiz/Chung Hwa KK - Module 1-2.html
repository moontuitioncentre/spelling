<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>词汇测验</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  margin:0;
  font-family:"Noto Sans SC",sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  transition:0.3s;
}


.card {
  font-size:clamp(40px, 12vw, 80px);
  margin-bottom:30px;
  text-align:center;
  word-break:break-word;
}


.question {
  font-size:25px;
  margin-bottom:20px;
}


.options {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,300px));
  gap:15px;
  justify-content:center;
}


.option-btn {

  width:300px;
  font-size:22px;
  padding:12px;
  margin:8px;

  border:none;
  border-radius:10px;

  background:#cccccc;
  color:rgb(0, 0, 0);

  cursor:pointer;
}

.correct {
  background:#00ff88 !important;
}

.wrong {
  background:#ff0019 !important;
}

@media(max-width:600px){

  .options {
    grid-template-columns:1fr;
  }

}

.option-btn:hover {
  opacity:0.8;
}

.option-btn small {

  display:block;
  font-size:20px;
  margin-top:5px;
  opacity:0.8;

}

.restart-btn {

  margin-top:30px;

  font-size:20px;

  background:#333;
  color:white;

  padding:10px 20px;

  border:none;
  border-radius:8px;

}


.result {

  font-size:25px;
  text-align:center;

}


.wrong-list {

  margin-top:20px;
  color:red;
  font-size:20px;

}

.pass-card,
.fail-card {

  width:320px;
  padding:35px 20px;

  border-radius:25px;

  text-align:center;

  margin:25px auto;

}


.pass-card {

  background:#c8f7c5;

}


.fail-card {

  background:#ffd6d6;

}


.result-icon {

  font-size:60px;

}


.result-title {

  font-size:50px;

  font-weight:bold;

  margin-top:15px;

}


.pass-card .result-title {

  color:#28a745;

}


.fail-card .result-title {

  color:#d32f2f;

}


.result-message {

  font-size:24px;

  margin-top:25px;

}


.pass-card .result-message {

  color:#28a745;

}


.fail-card .result-message {

  color:#d32f2f;

}

.next-btn {

  margin-top:25px;

  font-size:20px;

  background:#FFB800;

  color:rgb(0, 0, 0);

  padding:10px 25px;

  border:none;

  border-radius:8px;

}

</style>

</head>


<body>


<div class="question" id="number"></div>


<div class="card" id="word">
开始
</div>


<div class="options" id="options"></div>

<button 
id="nextBtn" 
class="next-btn" 
style="display:none;"
onclick="nextQuestion()">

下一题

</button>

<div class="result" id="result" style="display:none;"></div>


<button class="restart-btn" onclick="restart()">
重新开始
</button>



<script>


const bm = [
  "dunia",
  "sendirian",
  "nilai",
  "menghormati",
  "budaya",
  "muzium",
  "hidup",
  "memeluk",
  "meluncur ais",
  "catur",
  "badminton",
  "peluncur ais",
  "kelab",
  "melibatkan diri",
  "hobi",
  "kesah",
  "membalas surat",
  "sahabat pena",
  "kejutan",
  "pelakon",
  "wanita",
  "berjumpa",
  "ketawa",
  "subjek",
  "sampah",
  "daun",
  "memberi makan",
  "menanam",
  "memisahkan",
  "sedap",
  "percaya",
  "impian",
  "maharaja",
  "istana",
  "berlian",
  "sakit",
  "tinggal",
  "nyata",
  "meninggalkan",
  "menghargai",
  "keindahan",
  "mendatar",
  "alam semula jadi"
];


const zh = [
  "世界",
  "独自",
  "价值",
  "尊重",
  "文化",
  "博物馆",
  "活着",
  "拥抱",
  "滑冰",
  "国际象棋",
  "羽毛球",
  "花样滑冰运动员",
  "俱乐部",
  "参与",
  "爱好",
  "介意",
  "回信",
  "笔友",
  "惊喜",
  "演员",
  "女士",
  "见面",
  "笑",
  "科目",
  "垃圾",
  "叶子",
  "喂",
  "种植",
  "分开",
  "美味",
  "相信",
  "梦想",
  "皇帝",
  "皇宫",
  "钻石",
  "生病",
  "停留",
  "真实",
  "离开",
  "欣赏",
  "美丽",
  "水平的",
  "大自然"
];


const en = [
  "world",
  "alone",
  "value",
  "respect",
  "culture",
  "museum",
  "alive",
  "embrace",
  "ice-skate",
  "chess",
  "badminton",
  "figure skater",
  "club",
  "engage in",
  "hobby",
  "mind",
  "write back",
  "pen pal",
  "surprise",
  "actor",
  "lady",
  "meet",
  "laugh",
  "subject",
  "rubbish",
  "leaves",
  "feed",
  "plant",
  "separate",
  "delicious",
  "believe",
  "dream",
  "emperor",
  "palace",
  "diamond",
  "ill",
  "stay",
  "real",
  "leave",
  "appreciate",
  "beauty",
  "horizontal",
  "nature"
];

const words = en.map((item,index)=>{

return {

bm:bm[index],

zh:zh[index],

en:item

};

});

let list=[];

let current=0;

let correct=0;

let wrong=0;

let wrongWords=[];


// ===== 自动生成选择题 =====
function createQuestions(){

  return words.map(item=>{

    let wrongAnswers = shuffle(
words.filter(w=>w.bm !== item.bm)
)
.slice(0,3);


let options = shuffle([
  item,
  ...wrongAnswers
]);


    return {

word:item.en,

answer:item.zh,

options:options

};


  });

}



const wordDiv=document.getElementById("word");

const optionsDiv=document.getElementById("options");

const resultDiv=document.getElementById("result");

const numberDiv=document.getElementById("number");





function shuffle(array){

return array.sort(()=>Math.random()-0.5);

}





function showQuestion(){

document.getElementById("nextBtn").style.display="none";

let q=list[current];


numberDiv.innerText=
`第 ${current+1} / ${list.length} 题`;


wordDiv.innerText=q.word;


optionsDiv.innerHTML="";



q.options.forEach(option=>{


let btn=document.createElement("button");


btn.className="option-btn";


btn.innerHTML = `
<div>${option.zh}</div>
<small>${option.bm}</small>
`;

btn.onclick=function(){

checkAnswer(option.zh, btn);

};


optionsDiv.appendChild(btn);


});


document.body.style.background="white";


}







function checkAnswer(answer, clickedBtn){


let q=list[current];


// 禁止重复点击
let buttons=document.querySelectorAll(".option-btn");

buttons.forEach(btn=>{

btn.disabled=true;

});



if(answer===q.answer){


correct++;


// 学生选择正确 → 绿色

clickedBtn.classList.add("correct");


document.body.style.background="#c8f7c5";



}else{


wrong++;

wrongWords.push(q.word);


// 学生选择错误 → 红色

clickedBtn.classList.add("wrong");



// 找出正确答案按钮

buttons.forEach(btn=>{


if(btn.innerText.includes(q.answer)){


btn.classList.add("correct");


}


});


document.body.style.background="#f8c6c6";


}




// 显示下一题按钮

document.getElementById("nextBtn").style.display="block";



}







function showResult(){

document.body.style.background="white";


wordDiv.innerText="🎊";

optionsDiv.innerHTML="";


let score=Math.round(correct/list.length*100);



resultDiv.style.display="block";


resultDiv.innerHTML=`

${score>=80?

`
<div class="pass-card">

<div class="result-icon">
🏆
</div>

<div class="result-title">
PASS
</div>

<div class="result-message">
继续保持！
</div>

</div>
`

:

`

<div class="fail-card">

<div class="result-icon">
💪
</div>

<div class="result-title">
FAIL
</div>

<div class="result-message">
继续努力，加油！
</div>

</div>

`
}

总题数：${list.length}<br>

✅ 正确：${correct}<br>

❌ 错误：${wrong}<br><br>


正确率：${score}%<br><br>

${wrongWords.length?
`<div class="wrong-list">
错题：${wrongWords.join("，")}
</div>`:""}

`;


}

function nextQuestion(){


document.getElementById("nextBtn").style.display="none";


current++;


if(current<list.length){


showQuestion();


}else{


showResult();


}


}

function restart(){


list=shuffle(createQuestions());


current=0;

correct=0;

wrong=0;

wrongWords=[];


resultDiv.style.display="none";


showQuestion();


}



restart();



</script>


</body>
</html>
